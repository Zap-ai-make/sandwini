<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 402" role="img" aria-labelledby="titre-se-mono">
  <title id="titre-se-mono">Sandwidi et frère</title>
  <!--
    Variante monochrome du monogramme — pour l'en-tête du reçu imprimé et le
    favicon. Même tracé que `monogramme-se.svg`, sans dégradé : elle prend la
    couleur du texte courant (`currentColor`), donc l'encre du reçu sur le
    papier et le blanc sur la coquille sombre.

    La goutte est posée à 55 % : à plat, elle se confondrait avec le S qu'elle
    touche, et le monogramme deviendrait une tache. C'est la seule différence
    avec la version couleur, où c'est le bleu qui fait ce travail.
  -->
  <path fill="currentColor" fill-opacity="0.55" d="M6 126
    C3 160 4 210 20 246
    C36 285 75 315 151 334
    C190 331 221 314 221 286
    C200 258 130 236 60 212
    C30 196 12 162 6 126 Z"/>
